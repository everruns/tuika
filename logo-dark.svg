<svg xmlns="http://www.w3.org/2000/svg"
     width="1024"
     height="1024"
     viewBox="0 0 512 512"
     role="img"
     aria-labelledby="title desc">
  <title id="title">tuika dark logo</title>
  <desc id="desc">Two light rounded interface panels intersect at a gold anchor point for dark backgrounds.</desc>

  <defs>
    <!-- Dark-surface variant: exact primary geometry with navy replaced by
         white, preserving the Everruns gold focus point. -->
    <linearGradient id="front" x1="170" y1="158" x2="432" y2="420"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D4A43A"/>
      <stop offset="0.24" stop-color="#D4A43A"/>
      <stop offset="0.58" stop-color="#F4F7FC"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect x="72" y="92" width="274" height="274" rx="58"
        fill="none" stroke="#FFFFFF" stroke-width="30"/>
  <rect x="166" y="146" width="274" height="274" rx="58"
        fill="none" stroke="url(#front)" stroke-width="30"/>
  <rect x="215" y="195" width="66" height="66" rx="20" fill="#D4A43A"/>
</svg>
