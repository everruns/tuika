[package]
name = "tuika-codeformatters"
version = "0.4.3"
# Identity, MSRV, and license come from `[workspace.package]` in the root
# manifest — see the comment there for what is and isn't shared.
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Tree-sitter syntax highlighting for tuika's CodeBlock and Markdown components — a ready-made Highlighter implementation."
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["tui", "syntax-highlighting", "tree-sitter", "ratatui", "markdown"]
categories = ["command-line-interface", "text-processing"]
# Same rule as the root package: a demo recording is a GitHub-only asset. This
# crate's README embeds `docs/languages.gif` by absolute
# `raw.githubusercontent.com` URL, so nothing in the published `.crate` reads it
# — shipping it just adds ~400 KiB to every download. `tests/packaging.rs` in the
# root package guards this for both crates. The committed IAI baseline is a CI
# result snapshot, not a consumer file; benchmark sources still ship so the
# published benchmark remains reproducible.
exclude = ["docs/*.gif", "benches/*.json"]

# See the root Cargo.toml: disable the default lib bench harness so `cargo bench`
# runs only the Criterion target below.
[lib]
bench = false

# One feature per grammar, **all on by default** — adding a grammar to a host is
# the common case, and an existing dependant must not change behavior by
# upgrading. What the split buys is the opposite direction: a grammar is a
# multi-megabyte parse table in `.rodata`, and `build_configuration` names every
# one of them, so nothing the linker can see makes an unused grammar droppable.
# Bundling all fourteen costs ~21 MiB of read-only data in any binary that
# highlights *anything*; C# alone is ~5 MiB and Scala ~3.9 MiB.
#
# A host that knows its languages turns the rest off:
#
#     tuika-codeformatters = { version = "0.4", default-features = false, \
#                              features = ["rust", "python"] }
#
# This is the last-resort lever in
# `knowledge/processes/maintenance.md#binary-size-discipline` — reached for here
# because the language is a *runtime* string, so there is no use site to move
# the choice to, the way `ImageLayer::record` does for graphics protocols.
#
# `typescript` covers both TypeScript and TSX: one crate ships both grammars.
[features]
default = [
    "csharp",
    "css",
    "go",
    "html",
    "java",
    "php",
    "python",
    "ruby",
    "rust",
    "scala",
    "sql",
    "typescript",
    "zig",
]

csharp = ["dep:tree-sitter-c-sharp"]
css = ["dep:tree-sitter-css"]
go = ["dep:tree-sitter-go"]
html = ["dep:tree-sitter-html"]
java = ["dep:tree-sitter-java"]
php = ["dep:tree-sitter-php"]
python = ["dep:tree-sitter-python"]
ruby = ["dep:tree-sitter-ruby"]
rust = ["dep:tree-sitter-rust"]
scala = ["dep:tree-sitter-scala"]
sql = ["dep:tree-sitter-sequel"]
typescript = ["dep:tree-sitter-typescript"]
zig = ["dep:tree-sitter-zig"]

[dependencies]
tuika = { version = "0.10.0", path = "../.." }
ratatui = "0.30.2"
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-scala = { version = "0.26", optional = true }
tree-sitter-sequel = { version = "0.3", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-zig = { version = "1", optional = true }

[dev-dependencies]
# The runnable examples drive a full-screen loop; tuika owns the rendering,
# crossterm just supplies the raw event source (the same pair tuika's own
# examples use).
crossterm = "0.29"
# Benchmark harness — same lean configuration as tuika (see the root Cargo.toml).
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }
# See the root Cargo.toml — instruction-count harness for the CI regression gate.
iai-callgrind = "0.16.1"

[[bench]]
name = "highlight"
harness = false

[[bench]]
name = "highlight_iai"
harness = false

[[example]]
name = "highlight_file"
test = true
