# tuika is the root package of its own workspace; companion implementations for
# tree-sitter highlighting and Mermaid rendering live under `crates/` so tuika
# core stays grammar- and diagram-engine-free. Cargo skips nested packages when
# packaging, so the members' sources never land in tuika's `.crate`.
[workspace]
members = ["crates/tuika-codeformatters", "crates/tuika-html", "crates/tuika-mermaid"]

# Identity and toolchain floor are properties of the repository, not of any one
# package, so they live here and every manifest inherits them — a bumped MSRV or
# a new author cannot land in one crate and be forgotten in the others.
#
# Deliberately *not* inherited: `version` (the crates version independently),
# `description`/`keywords`/`categories` (they describe different crates), and
# `readme`/`exclude` — Cargo resolves an inherited `readme` path against the
# *workspace* root, so a member would advertise tuika's README instead of its own.
[workspace.package]
edition = "2024"
rust-version = "1.88"
authors = ["Mykhailo Chalyi <mike@chaliy.name>", "Everruns <support@everruns.com>"]
license = "MIT"
homepage = "https://github.com/everruns/tuika"
repository = "https://github.com/everruns/tuika"

[package]
name = "tuika"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "The application framework for Rust terminal UIs — flexbox layout, overlays, focus, keymap, components, and safe ratatui interoperability."
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["tui", "terminal", "ratatui", "framework", "widgets"]
categories = ["command-line-interface"]
# Two kinds of file are kept out of the published `.crate`:
#
# 1. The demo/showcase/theme/styling assets under `docs/` — and the recording
#    beside the `codex` example — total ~14 MiB and are consumed only from the
#    repository by `docs/*.md` or absolute rustdoc URLs. rustdoc/docs.rs
#    references none of them from its crate front page, so bundling them just
#    bloats the tarball. Keep `hero.gif`, `demos/image.svg`, and
#    `demos/split-footer.svg`: those are the only three the crates.io README
#    (`README.md`) embeds by relative path.
# 2. Repository machinery. Since tuika is the root package, everything beside it
#    in the repo would otherwise ship: internal knowledge, agent skills, CI
#    definitions, and the asset-generation scripts are all repo-only.
#
# See `tests/packaging.rs` for the guard that keeps this list honest.
exclude = [
    "docs/demos/*.gif",
    "docs/demos/*.png",
    "docs/showcases/*.gif",
    "examples/codex/*.gif",
    "docs/styling/*.gif",
    "docs/themes/*.gif",
    "/.agents",
    "/.claude",
    "/.github",
    "/knowledge",
    "/scripts",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    # Pins the *development* toolchain (1.94), which would contradict the
    # declared MSRV of 1.88 for anyone building from the unpacked crate.
    "/rust-toolchain.toml",
]

# Build docs with every feature so the optional `async` runner is documented,
# and set the `docsrs` cfg that turns on per-item feature badges (see lib.rs).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# No `#[bench]` fns in the lib, and the default libtest bench harness rejects
# Criterion's CLI flags — disable it so `cargo bench` runs only the Criterion
# targets below.
[lib]
bench = false

[features]
# The async runner (`AsyncRunner`). Off by default so sync-only hosts don't pull
# in a Tokio runtime. Enabling it adds Tokio (timer + `select!` macro), a
# `StreamExt` for polling the event stream, and crossterm's async `EventStream`.
async = ["dep:tokio", "dep:tokio-stream", "crossterm/event-stream"]

# Mirror of ratatui's `scrolling-regions`, which changes how content is inserted
# above an inline viewport: DECSTBM region scrolling instead of the portable
# scroll-and-repaint. Cargo unifies features one way only, so a host that turns
# the ratatui feature on would otherwise fail to build tuika — `HyperlinkBackend`
# implements `Backend`, and the feature adds two required methods. Declaring it
# here is what lets that impl be gated (see `src/term/hyperlink.rs`).
#
# It is NOT an optimization to reach for under `ScreenMode::SplitFooter`: rows
# scrolled out of a DECSTBM region are discarded by the terminal instead of
# entering its scrollback buffer, and a split footer exists precisely so
# published output *becomes* scrollback. The portable path costs a viewport
# repaint per published block and keeps it; the `codex` PTY tests pin the
# difference. See `knowledge/specs/screen-modes.md`.
scrolling-regions = [
    "ratatui-core/scrolling-regions",
    "ratatui-crossterm/scrolling-regions",
]

[dependencies]
# tuika uses only ratatui's cell buffer, style/text/layout primitives, the
# `Widget`/`StatefulWidget` traits, and the `Terminal`/backend loop — all of
# which live in `ratatui-core`. It renders none of ratatui's own widgets, so it
# depends on the sub-crates directly instead of the `ratatui` umbrella. This
# drops `ratatui-widgets` (Block/Paragraph/Table/Calendar/…) and `ratatui-macros`
# — and with them the `time`/`lru`/`line-clipping` transitive weight — from
# tuika's build. Downstream users keep every ratatui widget: they bring their own
# `ratatui` and render it through `Surface::render_ratatui`/`RatatuiView`, whose
# seam is a raw `&mut Buffer` from this same `ratatui-core` (Cargo unifies the
# version). `underline-color` matches the umbrella default so cell rendering is
# byte-identical; `std` is required for the terminal I/O loop.
ratatui-core = { version = "0.1", features = ["std", "underline-color"] }
# `CrosstermBackend` (+ `ClearType`/`WindowSize` impls) — the only piece tuika
# needs that is not in `ratatui-core`. Default features pin the crossterm 0.29
# backend, matching the direct `crossterm` dep below so Cargo dedups it.
ratatui-crossterm = "0.1"
crossterm = "0.29"
# Async runner only (feature = "async"). `time` for the tick interval, `macros`
# for `tokio::select!`; the host application brings its own runtime, so no `rt`.
tokio = { version = "1", features = ["time", "macros"], optional = true }
# `StreamExt::{next, filter_map}` for driving the crossterm `EventStream`.
tokio-stream = { version = "0.1", optional = true }
textwrap = "0.16"
unicode-segmentation = "1"
unicode-width = "0.2"
# CommonMark parsing for the streaming `Markdown` component. `default-features
# = false` drops the bundled HTML renderer and SIMD scanner we don't use, so
# this stays a small, pure-Rust addition to tuika's dependency set.
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
proptest = "1"
# `tests/pty_smoke.rs` drives the `gallery` example under a real pseudo-terminal
# and replays the byte stream through a reference terminal, so the alt-screen /
# OSC / truecolor / Braille protocol is asserted at the cell level. Both are
# test-only; neither reaches a downstream consumer.
portable-pty = "0.9.0"
vt100 = "0.16"
# The `ratatui` umbrella is a dev-dependency only: benches build `Vec<Line>`
# corpora and paint into a `Buffer` directly, and the doc examples demonstrate
# wrapping real ratatui *widgets* through `RatatuiView`/`Surface::render_ratatui`.
# Its `ratatui-core` matches the version the library depends on, so the `Buffer`
# type is shared across the interop seam.
ratatui = "0.30.2"
# Benchmark harness. default-features off drops the plotters/rayon HTML-report
# stack (heavy, and an MSRV liability) while keeping `cargo bench` working;
# Criterion still writes machine-readable `estimates.json` for archiving.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }
# Instruction-count benchmark harness (deterministic, machine-independent) for
# the committed baseline / CI regression gate. Needs Valgrind + a version-matched
# `iai-callgrind-runner` installed (`cargo install iai-callgrind-runner`).
iai-callgrind = "0.16.1"
# The `async` runner's tests drive `AsyncRunner` on a Tokio runtime with a fake
# event stream; `test-util` gives paused-clock control so ticks are deterministic
# instead of wall-clock-timed. Reachable only when `--features async` is on.
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }
tokio-stream = "0.1"

[[bench]]
name = "markdown"
harness = false

[[bench]]
name = "markdown_iai"
harness = false

[[bench]]
name = "scroll"
harness = false

[[bench]]
name = "scroll_iai"
harness = false

[[example]]
name = "async_dashboard"
required-features = ["async"]
