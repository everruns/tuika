# tuika is the root package of its own workspace; companion implementations for
# charts, tree-sitter highlighting, HTML, and Mermaid rendering live under
# `crates/` so tuika core stays graphics-engine-, grammar-, parser-, and
# diagram-engine-free. Cargo skips nested packages when
# packaging, so the members' sources never land in tuika's `.crate`.
[workspace]
members = [
    "crates/tuika-charts",
    "crates/tuika-codeformatters",
    "crates/tuika-html",
    "crates/tuika-mermaid",
]

# Identity and toolchain floor are properties of the repository, not of any one
# package, so they live here and every manifest inherits them — a bumped MSRV or
# a new author cannot land in one crate and be forgotten in the others.
#
# Deliberately *not* inherited: `version` (the crates version independently),
# `description`/`keywords`/`categories` (they describe different crates), and
# `readme`/`exclude` — Cargo resolves an inherited `readme` path against the
# *workspace* root, so a member would advertise tuika's README instead of its own.
[workspace.package]
edition = "2024"
rust-version = "1.88"
authors = ["Mykhailo Chalyi <mike@chaliy.name>", "Everruns <support@everruns.com>"]
license = "MIT"
homepage = "https://tuika.dev"
repository = "https://github.com/everruns/tuika"

[package]
name = "tuika"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "The application framework for Rust terminal UIs — flexbox layout, overlays, focus, keymap, components, and a dependency-light cell renderer."
homepage.workspace = true
documentation = "https://docs.rs/tuika"
repository.workspace = true
readme = "README.md"
keywords = ["tui", "terminal", "ratatui", "framework", "widgets"]
categories = ["command-line-interface"]
# Three kinds of file are kept out of the published `.crate`:
#
# 1. The public `docs/` tree, alternate logo exports, and recordings beside the
#    in-repo application showcases are consumed from the tagged repository by
#    public pages or tooling. rustdoc/docs.rs references none of them from its
#    crate front page, and the crates.io README uses release-tag-pinned absolute
#    URLs for guides and images, so packaged copies would be incomplete and
#    unreachable.
# 2. Benchmark result snapshots. Benchmark sources remain reproducible, but the
#    committed IAI baseline is a CI input rather than a consumer file.
# 3. Repository machinery. Since tuika is the root package, everything beside it
#    in the repo would otherwise ship: the generated documentation site,
#    internal knowledge, agent skills, CI definitions, and asset-generation
#    scripts are all repo-only.
#
# See `tests/packaging.rs` for the guard that keeps this list honest.
exclude = [
    "/logo.svg",
    "/logo-dark.svg",
    "/logo-mono.svg",
    "/logo*.png",
    "/docs",
    "examples/codex/*.gif",
    "examples/workbench_demo/*.gif",
    "/benches/*.json",
    "/.agents",
    "/.claude",
    "/.github",
    "/knowledge",
    "/scripts",
    "/site",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    # Pins the *development* toolchain (1.94), which would contradict the
    # declared MSRV of 1.88 for anyone building from the unpacked crate.
    "/rust-toolchain.toml",
]

# Build docs with every feature so the optional `async` runner is documented,
# and set the `docsrs` cfg that turns on per-item feature badges (see lib.rs).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# No `#[bench]` fns in the lib, and the default libtest bench harness rejects
# Criterion's CLI flags — disable it so `cargo bench` runs only the Criterion
# targets below.
[lib]
bench = false

[features]
# The async runner (`AsyncRunner`). Off by default so sync-only hosts don't pull
# in a Tokio runtime. Enabling it adds Tokio (timer + `select!` macro), a
# `StreamExt` for polling the event stream, and crossterm's async `EventStream`.
async = ["dep:tokio", "dep:futures-core", "crossterm/event-stream"]

# Adds DECSTBM region scrolling to `Backend` as an alternative to the portable
# scroll-and-repaint when inserting content above an inline viewport. Now a
# feature of tuika's *own* `Backend` trait (see `term/traits.rs`), so it adds two
# required methods to any host implementation — which is the whole reason it is a
# feature rather than always-on.
#
# It is NOT an optimization to reach for under `ScreenMode::SplitFooter`: rows
# scrolled out of a DECSTBM region are discarded by the terminal instead of
# entering its scrollback buffer, and a split footer exists precisely so
# published output *becomes* scrollback. The portable path costs a viewport
# repaint per published block and keeps it; the `codex` PTY tests pin the
# difference. See `knowledge/specs/screen-modes.md`.

ratatui = ["dep:ratatui-core"]

scrolling-regions = []

[dependencies]
# Only for the optional `ratatui` interop feature — tuika owns its own cell
# grid, layout primitives, backend, and terminal loop, so nothing here is on the
# default path. See the `ratatui` feature below.
ratatui-core = { version = "0.1", features = [
    "std",
    "underline-color",
], optional = true }
crossterm = "0.29"
# Async runner only (feature = "async"). `time` for the tick interval, `macros`
# for `tokio::select!`; the host application brings its own runtime, so no `rt`.
tokio = { version = "1", features = ["time", "macros"], optional = true }
# The `Stream` trait for the runner's event/message bounds. Not a new crate:
# `async` turns on `crossterm/event-stream`, which already pulls `futures-core`
# in. The three adapters the runner needs (`next`, `filter_map`, `empty`) are
# ~80 lines in `runner/stream.rs`, which is what lets `tokio-stream` be a
# dev-dependency instead of a consumer one — and costs hosts nothing, since
# `tokio_stream::Stream` *is* this trait.
futures-core = { version = "0.3", optional = true }
unicode-segmentation = "1"
unicode-width = "0.2"
# CommonMark parsing for the streaming `Markdown` component. `default-features
# = false` drops the bundled HTML renderer and SIMD scanner we don't use, so
# this stays a small, pure-Rust addition to tuika's dependency set.
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
proptest = "1"
# `tests/pty_smoke.rs` drives the `gallery` example under a real pseudo-terminal
# and replays the byte stream through a reference terminal, so the alt-screen /
# OSC / truecolor / Braille protocol is asserted at the cell level. Both are
# test-only; neither reaches a downstream consumer.
portable-pty = "0.9.0"
vt100 = "0.16"
# The `ratatui` umbrella is a dev-dependency only: benches build `Vec<Line>`
# corpora and paint into a `Buffer` directly, and the doc examples demonstrate
# wrapping real ratatui *widgets* through `RatatuiView`/`Surface::render_ratatui`.
# Its `ratatui-core` matches the version the library depends on, so the `Buffer`
# type is shared across the interop boundary.
ratatui = "0.30.2"
# The in-repo application-shell showcase exercises the published companion
# components as a consumer would: adaptive charts and Rust syntax highlighting.
tuika-charts = { version = "0.1.2", path = "crates/tuika-charts" }
tuika-codeformatters = {
    version = "0.5.0",
    path = "crates/tuika-codeformatters",
    default-features = false,
    features = ["rust"],
}
# Benchmark harness. default-features off drops the plotters/rayon HTML-report
# stack (heavy, and an MSRV liability) while keeping `cargo bench` working;
# Criterion still writes machine-readable `estimates.json` for archiving.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }
# Instruction-count benchmark harness (deterministic, machine-independent) for
# the committed baseline / CI regression gate. Needs Valgrind + a version-matched
# `iai-callgrind-runner` installed (`cargo install iai-callgrind-runner`).
iai-callgrind = "0.16.1"
# The `async` runner's tests drive `AsyncRunner` on a Tokio runtime with a fake
# event stream; `test-util` gives paused-clock control so ticks are deterministic
# instead of wall-clock-timed. Reachable only when `--features async` is on.
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "test-util"] }
# Dev-only, and deliberately so: the doc example and the mpsc test drive the
# runner through `tokio_stream::wrappers::ReceiverStream`, which proves a host's
# `tokio-stream` still satisfies the `futures-core` bounds the runner declares.
tokio-stream = { version = "0.1", features = ["sync"] }

[[bench]]
name = "markdown"
harness = false

[[bench]]
name = "markdown_iai"
harness = false

[[bench]]
name = "scroll"
harness = false

[[bench]]
name = "scroll_iai"
harness = false

[[bench]]
name = "layout"
harness = false

[[example]]
name = "async_dashboard"
required-features = ["async"]

# Demonstrates wrapping real ratatui widgets, so it needs the interop feature.
[[example]]
name = "ratatui_dashboard"
required-features = ["ratatui"]
